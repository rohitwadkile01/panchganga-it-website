<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panchganga IT Services and Solutions - affordable websites, Power BI dashboards, and Python & AI automation for small businesses.">
  <meta name="keywords" content="Panchganga IT Services, website development, Power BI, Excel dashboard, Python automation, AI automation, Pune">
  <meta name="author" content="Panchganga IT Services and Solutions">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Panchganga IT Services and Solutions | Affordable IT Solutions</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --dark: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --success: #16a34a;
      --shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    /* Navbar */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226,232,240,.8);
    }

    .nav-inner {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      color: var(--dark);
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: block;
      object-fit: contain;
    }

    .brand span:last-child { line-height: 1.1; }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      margin-top: 3px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover { color: var(--primary); }

    .nav-cta {
      padding: 10px 16px;
      color: white !important;
      background: var(--primary);
      border-radius: 10px;
    }

    .nav-cta:hover { background: var(--primary-dark); }

    /* Hero */
    .hero {
      background:
        radial-gradient(circle at 85% 15%, rgba(37,99,235,.14), transparent 28%),
        radial-gradient(circle at 15% 85%, rgba(124,58,237,.10), transparent 25%),
        var(--light);
      padding: 92px 0 82px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      align-items: center;
      gap: 65px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      color: var(--primary-dark);
      background: #eff6ff;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 6vw, 70px);
      line-height: 1.03;
      letter-spacing: -2.5px;
      color: var(--dark);
      margin-bottom: 22px;
    }

    h1 span { color: var(--primary); }

    .hero p {
      max-width: 650px;
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .trust-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 26px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .trust-bar .dot { color: #cbd5e1; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 19px;
      border-radius: 11px;
      font-weight: 750;
      font-size: 14px;
      transition: .2s ease;
    }

    .btn-primary {
      color: white;
      background: var(--primary);
      box-shadow: 0 8px 20px rgba(37,99,235,.22);
    }

    .btn-primary:hover { transform: translateY(-2px); background: var(--primary-dark); }

    .btn-secondary {
      color: var(--dark);
      background: white;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { transform: translateY(-2px); border-color: #93c5fd; }

    .hero-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .hero-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .mini-logo {
      width: 54px;
      height: 54px;
      display: block;
      border-radius: 50%;
      object-fit: contain;
    }

    .status {
      font-size: 12px;
      color: var(--success);
      font-weight: 700;
      background: #f0fdf4;
      padding: 7px 10px;
      border-radius: 999px;
    }

    .hero-card h3 {
      color: var(--dark);
      font-size: 24px;
      margin-bottom: 8px;
    }

    .hero-card > p {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .service-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-top: 1px solid var(--border);
      font-weight: 650;
      color: var(--dark);
    }

    .service-mini-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #eff6ff;
      color: var(--primary);
    }

    /* Sections */
    section { padding: 86px 0; }

    .section-head {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 48px;
    }

    .section-head .label {
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 9px;
    }

    .section-head h2 {
      font-size: clamp(30px, 4vw, 43px);
      line-height: 1.15;
      letter-spacing: -1px;
      color: var(--dark);
      margin-bottom: 13px;
    }

    .section-head p { color: var(--muted); }

    /* Services */
    .services { background: var(--light); }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .service-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 5px 22px rgba(15,23,42,.04);
      transition: .2s ease;
    }

    .service-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .service-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 22px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      color: var(--dark);
      font-size: 20px;
      margin-bottom: 9px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .price {
      font-size: 22px;
      font-weight: 850;
      color: var(--dark);
      margin-bottom: 16px;
    }

    .price small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .features {
      list-style: none;
      display: grid;
      gap: 9px;
      font-size: 13px;
    }

    .features li::before {
      content: "✓";
      color: var(--success);
      font-weight: 900;
      margin-right: 8px;
    }

    .service-cta {
      width: 100%;
      margin-top: 6px;
    }

    /* Who We Help */
    .who-we-help { background: var(--light); }

    .who-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .who-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      transition: .2s ease;
    }

    .who-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(15,23,42,.06); }

    .who-icon { font-size: 26px; margin-bottom: 12px; }

    .who-card h3 { color: var(--dark); font-size: 15px; margin-bottom: 5px; }

    .who-card p { color: var(--muted); font-size: 12.5px; }

    /* Free Audit */
    .audit-section {
      background: var(--dark);
      color: white;
      text-align: center;
    }

    .audit-section h2 { font-size: clamp(26px, 3.6vw, 36px); margin-bottom: 12px; }
